<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS — AI-Tagged Library of Archived Saves</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>

<header>
  <div class="masthead-row">
    <div class="title-col">
      <h1>ATLAS</h1>
      <div class="kicker">AI-Tagged Library of Archived Saves</div>
    </div>
    <div class="lede">A map for everything you saved online. <b id="lede-n">0 items</b> filed and waiting.</div>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div class="wrap">
  <aside>
    <div class="sec-title">Library</div>
    <div id="nav-core"></div>
    <div class="sec-title">Collections</div>
    <div id="nav-collections"></div>
    <div class="sec-title">My Tags</div>
    <div id="nav-tags"></div>
    <div class="addtag">
      <input id="newtag" type="text" placeholder="new tag…" maxlength="22">
      <button id="addtag-btn" title="Create tag">+</button>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" type="text" placeholder="Search captions & creators…">
        </div>
        <div class="seg" id="typeseg">
          <button data-type="all" class="active">All</button>
          <button data-type="reel">Reels</button>
          <button data-type="post">Posts</button>
        </div>
        <select class="sort" id="sort">
          <option value="new">Newest</option>
          <option value="old">Oldest</option>
          <option value="owner">Creator A–Z</option>
        </select>
      </div>
      <div class="toolbar-right">
        <button class="toolbtn" id="ai-btn" type="button" title="Generate AI summaries">
          <svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 0 2h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1 0-2h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/></svg>
          AI
        </button>
        <button class="toolbtn" id="settings-btn" type="button" title="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </button>
        <button class="toolbtn" id="import-btn" type="button" title="Import data">
          <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>
          Import
        </button>
        <button class="toolbtn" id="reset-btn" type="button" title="Reset catalog">
          <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 15h10l1-15"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          Reset
        </button>
      </div>
      <input class="fileinput" id="import-file" type="file" accept=".json,.html,application/json,text/html">
    </div>
    <div id="ai-progress-bar" style="display:none" class="ai-progress-bar">
      <div id="ai-progress-inner" class="ai-progress-inner"></div>
    </div>
    <div class="crumb"><h2 id="crumb-title">All Saves</h2><span class="count" id="crumb-count"></span></div>
    <div class="grid" id="grid"></div>
    <div id="grid-sentinel" style="height:1px"></div>
  </main>
</div>

<footer>
  <span>ATLAS · built from your saved data</span>
  <span class="savestate"><span class="pulse"></span><span id="savemsg">changes save automatically</span></span>
</footer>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<div class="overlay" id="settings-overlay">
  <div class="modal" id="settings-modal"></div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
