<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS — A Tagged Library of Archived Saves</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>

<header>
  <div class="masthead-row">
    <div class="title-col">
      <h1>ATLAS</h1>
      <div class="kicker">A Tagged Library of Archived Saves</div>
    </div>
    <div class="lede">A map for everything you saved online. <b id="lede-n">0 items</b> filed and waiting.</div>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div class="wrap">
  <aside>
    <div class="sec-title">Library</div>
    <div id="nav-core"></div>
    <div class="sec-title">Collections</div>
    <div id="nav-collections"></div>
    <div class="sec-title">My Tags</div>
    <div id="nav-tags"></div>
    <div class="addtag">
      <input id="newtag" type="text" placeholder="new tag…" maxlength="22">
      <button id="addtag-btn" title="Create tag">+</button>
    </div>
    <div class="sec-title">Trash</div>
    <div id="nav-trash"></div>
  </aside>

  <main>
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" type="text" placeholder="Search captions & creators…">
        </div>
        <div class="seg" id="typeseg">
          <button data-type="all" class="active">All</button>
          <button data-type="reel">Reels</button>
          <button data-type="post">Posts</button>
        </div>
        <select class="sort" id="sort">
          <option value="new">Newest</option>
          <option value="old">Oldest</option>
          <option value="owner">Creator A–Z</option>
        </select>
      </div>
      <div class="toolbar-right">
        <button class="toolbtn" id="import-btn" type="button" title="Import data">
          <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>
          Import
        </button>
        <button class="toolbtn" id="reset-btn" type="button" title="Reset catalog">
          <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 15h10l1-15"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          Reset
        </button>
      </div>
      <input class="fileinput" id="import-file" type="file" accept=".json,.html,application/json,text/html">
    </div>
    <div class="crumb"><h2 id="crumb-title">All Saves</h2><span class="count" id="crumb-count"></span></div>
    <div class="grid" id="grid"></div>
    <div id="grid-sentinel" style="height:1px"></div>
  </main>
</div>

<footer>
  <span>ATLAS · built from your saved data</span>
  <span class="savestate"><span class="pulse"></span><span id="savemsg">changes save automatically</span></span>
</footer>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
